<div class="login-panel-steex">
  <div class="login-hero" aria-hidden="true">
    <img src="assets/images/login-parkey.png" alt="" />
  </div>
  <div class="login-card-steex">
    <div class="text-center mb-3">
      <img src="assets/images/logo-parkey.png" width="408" height="490" alt="Parkey" class="login-logo" />
    </div>
    <h2 class="h4 mb-2">Nouveau mot de passe</h2>
    <p class="login-lead">Saisissez-le deux fois pour confirmer.</p>

    @if (success()) {
      <div class="alert alert-success py-2">{{ success() }}</div>
      <button type="button" class="btn btn-primary w-100" (click)="goLogin()">Se connecter</button>
    } @else {
      <label class="form-label" for="reset-password">Nouveau mot de passe</label>
      <input
        id="reset-password"
        type="password"
        class="form-control mb-3"
        autocomplete="new-password"
        [value]="password()"
        (input)="password.set($any($event.target).value)"
      />
      <label class="form-label" for="reset-confirm">Confirmer le mot de passe</label>
      <input
        id="reset-confirm"
        type="password"
        class="form-control mb-3"
        autocomplete="new-password"
        [value]="confirm()"
        (input)="confirm.set($any($event.target).value)"
        (keyup.enter)="submit()"
      />
      @if (error()) {
        <div class="alert alert-danger py-2">{{ error() }}</div>
      }
      <button type="button" class="btn btn-primary w-100" (click)="submit()" [disabled]="loading() || !token()">
        @if (loading()) {
          Enregistrement…
        } @else {
          Enregistrer
        }
      </button>
      <a routerLink="/" class="login-forgot">Retour à la connexion</a>
    }
  </div>
</div>
