# Ingress via Traefik (embarque par defaut dans k3s, rien a installer).
#
# Accessible ensuite sur http://parkey.local/ - il faut que ce nom
# resolve vers l'IP de la machine qui fait tourner k3s. Depuis le
# navigateur Windows (k3s tourne dans WSL), ajoute une ligne dans
# C:\Windows\System32\drivers\etc\hosts (en admin) :
#   127.0.0.1        parkey.local
# Si ca ne repond pas (selon le mode reseau WSL2), remplace 127.0.0.1
# par l'IP de la distro WSL (a recuperer avec `hostname -I` dans WSL).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pothole-angular
  namespace: parkey
spec:
  ingressClassName: traefik
  rules:
    - host: parkey.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pothole-angular
                port:
                  number: 80
