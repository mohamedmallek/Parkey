apiVersion: apps/v1
kind: Deployment
metadata:
  name: pothole-dash-api
  namespace: parkey
  labels:
    app: pothole-dash-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pothole-dash-api
  template:
    metadata:
      labels:
        app: pothole-dash-api
    spec:
      containers:
        - name: pothole-dash-api
          image: mallek21/pothole-dash-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: pothole-dash-api-config
            - secretRef:
                name: pothole-dash-api-secret
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: pothole-dash-api-models
        - name: data
          persistentVolumeClaim:
            claimName: pothole-dash-api-data
